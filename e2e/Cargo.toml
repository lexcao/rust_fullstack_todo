[package]
name = "e2e"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Browser end-to-end tests and screenshots for the Crabnote frontend"

[dependencies]
fantoccini = { version = "0.22.1", default-features = false, features = ["rustls-tls"] }
http = "1.5.0"
serde_json = "1.0.154"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.8"
