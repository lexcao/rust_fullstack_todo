[package]
name = "frontend"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
gloo = "0.12"
yew = "0.23"
yew-hooks = "0.6"
serde = { version = "1", features = ["derive"] }
common = { path = "../common" }
wasm-bindgen-futures = "0.4"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

[dependencies.uuid]
version = "1"
features = [
    "v4",
    "js",
]

[dependencies.web-sys]
version = "0.3"
features = [
    "HtmlInputElement",
]
