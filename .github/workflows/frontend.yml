name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      APP_REMOTE_ENDPOINT: https://rust-fullstack-todo.up.railway.app

    steps:
    - uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - run: rustup target add wasm32-unknown-unknown
    - run: cargo install trunk --version 0.21.14 --locked
    - name: Lint (new Rust tooling crates)
      run: cargo clippy -p e2e -p og-gen --all-targets -- -D warnings
    - name: Unit tests
      run: cargo test -p frontend -p common
    - name: Build
      run: cd frontend && trunk build --release
    - name: E2E (headless Chrome, local dist)
      run: |
        google-chrome --version
        "$CHROMEWEBDRIVER/chromedriver" --version
        CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p e2e -- --ignored
    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: dist
        publish_dir: frontend/dist
        force_orphan: true
