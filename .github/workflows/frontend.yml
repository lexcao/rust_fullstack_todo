name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      APP_REMOTE_ENDPOINT: https://rust-fullstack-todo.up.railway.app

    steps:
    - uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Toolchain (rust-toolchain.toml)
      run: |
        rustup toolchain install
        rustc -V && cargo -V
    - name: Install trunk 0.21.14
      # 缓存会恢复 ~/.cargo/bin/trunk 但没有 cargo 的安装记录，直接 cargo install 会报「already exists」
      run: |
        if trunk --version 2>/dev/null | grep -qx 'trunk 0.21.14'; then
          echo "trunk 0.21.14 已在缓存里"
        else
          cargo install trunk --version 0.21.14 --locked --force
        fi
        trunk --version
    - name: Lint
      run: |
        cargo clippy -p frontend -p common -p e2e -p og-gen --all-targets -- -D warnings
        cargo clippy -p frontend -p common --target wasm32-unknown-unknown -- -D warnings
    - name: Backend compiles (not deployed)
      run: cargo clippy -p backend -- -D warnings
    - name: Unit tests
      run: cargo test -p frontend -p common
    - name: Build
      run: cd frontend && trunk build --release
    - name: E2E (headless Chrome, local dist)
      run: |
        google-chrome --version
        "$CHROMEWEBDRIVER/chromedriver" --version
        CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p e2e -- --ignored
    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: dist
        publish_dir: frontend/dist
        force_orphan: true
