name: Backend

# 后端测试：单测（内存 mock）+ 仓储/集成/API 契约测试（真 Postgres）。
# 只测试，不构建镜像、不部署。和前端发布的 Rust workflow 相互独立。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      # 免费 runner 上的 service container；账号、库名与 application.toml 的本地默认值一致（不是任何真实密钥）
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rust_fullstack_todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d rust_fullstack_todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-backend-${{ hashFiles('**/Cargo.lock') }}
    - name: Toolchain (rust-toolchain.toml)
      run: |
        rustup toolchain install
        rustc -V
    - name: Schema
      env:
        PGPASSWORD: password
      run: psql -h localhost -U user -d rust_fullstack_todo -v ON_ERROR_STOP=1 -f backend/schemas/00_init_tables.sql
    - name: Lint
      run: cargo clippy -p backend --all-targets -- -D warnings
    - name: Test
      run: cargo test -p backend
