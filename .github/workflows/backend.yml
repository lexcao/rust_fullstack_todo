name: Backend

# 后端测试：单测（内存 mock）+ 仓储/集成/API 契约测试（真 Postgres）。
# 只测试，不构建镜像、不部署。和前端发布的 Rust workflow 相互独立。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  # 只指向本 job 的 service container（与 application.toml 本地默认值相同，不是真实密钥）。
  # #[sqlx::test] 用它为每个测试新建一个独立库；契约/ping 测试用 application.toml 的共享库。
  DATABASE_URL: postgres://user:password@localhost:5432/rust_fullstack_todo
  # 编译期查询检查只用仓库里提交的 backend/.sqlx，不连库；是否过期由 "Offline query data" 一步检查
  SQLX_OFFLINE: "true"

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      # 免费 runner 上的 service container；账号、库名与 application.toml 的本地默认值一致（不是任何真实密钥）
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rust_fullstack_todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d rust_fullstack_todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/sqlx
          ~/.cargo/bin/cargo-sqlx
          target
        key: ${{ runner.os }}-backend-${{ hashFiles('**/Cargo.lock') }}
    - name: Toolchain (rust-toolchain.toml)
      run: |
        rustup toolchain install
        rustc -V
    - name: Install sqlx-cli 0.9.0
      run: |
        # 缓存命中时已安装同版本就跳过；版本不同才强制重装（幂等）
        if cargo sqlx --version 2>/dev/null | grep -q "0.9.0"; then
          echo "sqlx-cli 0.9.0 already installed"
        else
          cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked --force
        fi
    # 不再用 psql 建表：表由 backend/migrations 建（服务启动和 #[sqlx::test] 都会自动跑迁移）
    - name: Migrations (empty database, then idempotent re-run)
      working-directory: backend
      run: |
        cargo sqlx migrate run
        cargo sqlx migrate run
        cargo sqlx migrate info
    - name: Offline query data is up to date
      working-directory: backend
      env:
        SQLX_OFFLINE: "false"
      run: cargo sqlx prepare --check
    - name: Lint
      run: cargo clippy -p backend --all-targets -- -D warnings
    - name: Test
      run: cargo test -p backend
