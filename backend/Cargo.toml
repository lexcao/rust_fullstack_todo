[package]
name = "backend"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "request-id", "timeout", "trace"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 纯 Rust Postgres 驱动 + rustls（ring + webpki 根证书）：不依赖 OpenSSL，也不依赖系统 CA。
# 改了 query!/query_as! 的 SQL 后，在 backend/ 下对已迁移的库跑 `cargo sqlx prepare` 并提交 .sqlx/（CI 用 --check 检查）。
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "chrono"] }
config = "0.15"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
common = { path = "../common" }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
# oneshot：handler 单测直接打 Router，不连数据库。
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
